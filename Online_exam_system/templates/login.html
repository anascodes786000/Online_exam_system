{% extends "base.html" %}

{% block title %}Sign In - Online Exam System{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card shadow-sm p-4">
        <div class="text-center mb-4">
          <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary rounded-circle mb-2" style="width: 56px; height: 56px;">
            <i class="fas fa-lock fs-4"></i>
          </div>
          <h3 class="fw-bold">Sign In</h3>
          <p class="text-muted small">Enter your credentials to access your account</p>
        </div>

        <form method="POST" action="{{ url_for('login') }}">
          <div class="mb-3">
            <label for="identifier" class="form-label fw-semibold">Email or Username</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fas fa-envelope"></i></span>
              <input type="text" class="form-control" id="identifier" name="identifier" required placeholder="admin@exam.com or username" autofocus>
            </div>
          </div>

          <div class="mb-4">
            <label for="password" class="form-label fw-semibold">Password</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fas fa-key"></i></span>
              <input type="password" class="form-control" id="password" name="password" required placeholder="••••••••">
            </div>
          </div>

          <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
            <i class="fas fa-sign-in-alt me-2"></i> Sign In
          </button>
        </form>

        <hr class="my-4">

        <div class="text-center mb-3">
          <span class="text-muted small fw-semibold">⚡ FAST 1-CLICK DEMO LOGIN:</span>
        </div>
        <div class="d-grid gap-2">
          <a href="{{ url_for('demo_login', role='student') }}" class="btn btn-outline-info text-dark btn-sm fw-semibold">
            <i class="fas fa-user-graduate me-1 text-primary"></i> Login as Demo Student (Alex)
          </a>
          <a href="{{ url_for('demo_login', role='admin') }}" class="btn btn-outline-danger btn-sm fw-semibold">
            <i class="fas fa-user-shield me-1"></i> Login as Demo Admin
          </a>
        </div>

        <div class="text-center mt-4">
          <span class="text-muted small">Don't have an account? </span>
          <a href="{{ url_for('register') }}" class="fw-semibold text-primary">Register Here</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
